*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1410;touch-action:none;overscroll-behavior:none}
body{font-family:"Chakra Petch",Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
video::-webkit-media-controls{display:none!important}
.ui{position:fixed;inset:0;pointer-events:none}
#hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18vh 16px 17vh;pointer-events:auto;opacity:0;transition:opacity .3s}
body.ready #hint{opacity:1}
#hint.hidden{opacity:0!important;pointer-events:none}
.goal{font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,6.2vmin,40px);line-height:1.1;text-align:center;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6);letter-spacing:.5px}
.goal b{color:#3dff8a;font-weight:400}
.swipe{position:relative;width:min(70vmin,300px);height:110px}
.track{position:absolute;left:8%;right:8%;top:38px;height:10px;border-radius:6px;background:rgba(255,255,255,.28);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.track:before,.track:after{content:"";position:absolute;top:-7px;border:12px solid transparent}
.track:before{left:-20px;border-right-color:rgba(255,255,255,.7)}
.track:after{right:-20px;border-left-color:rgba(255,255,255,.7)}
.hand{position:absolute;top:24px;left:50%;width:64px;height:78px;margin-left:-18px;animation:swipe 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
@keyframes swipe{0%,100%{transform:translateX(-80px) rotate(-12deg)}50%{transform:translateX(80px) rotate(10deg)}}
.label{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:700;font-size:18px;letter-spacing:2px;text-shadow:0 2px 0 #000}
#banner{white-space:pre-line;line-height:1.05;position:fixed;left:0;right:0;top:34%;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(28px,10vmin,72px);opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5);padding:0 16px;pointer-events:none}
#banner.show{opacity:1;transform:scale(1)}
#banner.go{color:#3dff8a}#banner.win{color:#ffd23a}#banner.lose{color:#ff5a4f}#banner.warn{color:#ff5a4f;font-size:clamp(22px,8vmin,52px)}
#finger{position:fixed;left:50%;bottom:20vh;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
#confetti i{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,8,6,.35),rgba(10,8,6,.78));opacity:0;pointer-events:none;transition:opacity .4s;padding:16vh 16px 14vh}
#end.show{opacity:1;pointer-events:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:min(2.6vh,18px);text-align:center;max-width:520px;transform:translateY(20px);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#end.show .card{transform:none}
.logo{font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,11vmin,78px);line-height:.95;color:#ffd23a;text-shadow:0 5px 0 #8a4b00,0 10px 24px rgba(0,0,0,.6)}
.logo small{display:block;font-size:.38em;color:#fff;text-shadow:0 3px 0 #000;letter-spacing:3px;margin-bottom:6px}
#end-title{font-family:Bungee,Impact,sans-serif;font-size:clamp(18px,5vmin,30px);text-shadow:0 3px 0 #000}
#end-sub{font-size:clamp(15px,3.6vmin,20px);opacity:.92;text-shadow:0 2px 0 #000;max-width:30ch}
#cta{pointer-events:auto;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,5.6vmin,32px);color:#1a1004;background:linear-gradient(#ffe066,#ffb21a);border:0;border-radius:999px;padding:.7em 1.4em;box-shadow:0 6px 0 #a35d00,0 12px 26px rgba(0,0,0,.5);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
#cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a35d00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#retry{pointer-events:auto;background:none;border:0;color:#fff;font:700 16px "Chakra Petch",Arial,sans-serif;letter-spacing:2px;opacity:.85;text-decoration:underline;padding:8px 14px;cursor:pointer}
@media (orientation:landscape){

 #end{padding:10vh 16px}
 .card{gap:min(2vh,12px)}
}
