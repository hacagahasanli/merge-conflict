*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#16204a;touch-action:none;overscroll-behavior:none}
body{font-family:"Chakra Petch",Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
#hud{position:fixed;left:0;right:0;top:max(11vh,64px);display:flex;justify-content:space-between;gap:18px;padding:0 16px;pointer-events:none;opacity:0;transition:opacity .3s}
body.ready #hud{opacity:1}
.hp{flex:1;max-width:280px}
.hp.r{text-align:right}
.name{font-family:Bungee,Impact,sans-serif;font-size:clamp(15px,4.4vmin,22px);line-height:1;text-shadow:0 2px 0 #000;margin-bottom:5px;white-space:nowrap}
.name span{font-family:"Chakra Petch",Arial,sans-serif;font-size:.7em;color:#fff;opacity:.85;margin:0 .35em}
.l .name{color:#ff7a4d}.r .name{color:#4fe39a}
.bar{position:relative;height:clamp(12px,2.6vmin,16px);background:rgba(10,12,24,.75);border:2px solid rgba(255,255,255,.85);border-radius:4px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.bar i,.bar b{position:absolute;top:0;bottom:0;left:0;width:100%;transform-origin:left;transition:transform .08s}
.r .bar i,.r .bar b{transform-origin:right}
.bar b{background:#fff;transition:transform .5s .25s}
.l .bar i{background:linear-gradient(#ff9a5c,#f2542d)}
.r .bar i{background:linear-gradient(#5cf0a4,#2ec27e)}
#hint{position:fixed;left:0;right:0;top:max(19vh,104px);display:flex;justify-content:center;padding:0 16px;pointer-events:none;opacity:0;transition:opacity .3s}
body.ready #hint{opacity:1}
#hint.hidden{opacity:0!important}
.goal{font-family:Bungee,Impact,sans-serif;font-size:clamp(19px,5.6vmin,36px);line-height:1.15;text-align:center;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6)}
.goal b{color:#ffd23a;font-weight:400}
#hand{position:fixed;left:0;top:0;width:58px;height:70px;margin:-2px 0 0 -25px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));pointer-events:none;opacity:0;transition:opacity .2s}
#banner{white-space:pre-line;line-height:1.05;position:fixed;left:0;right:0;top:30%;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(30px,11vmin,76px);opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5);padding:0 16px;pointer-events:none}
#banner.show{opacity:1;transform:scale(1)}
#banner.go{color:#ffd23a}#banner.win{color:#ffd23a;font-size:clamp(44px,17vmin,120px)}#banner.lose{color:#ff5a4f}#banner.warn{color:#ff5a4f;font-size:clamp(24px,8.4vmin,56px)}
#banner.push{color:#7fe0ff;font-size:clamp(26px,9vmin,60px);animation:throb .5s ease-in-out infinite}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#nums div{position:fixed;left:0;top:0;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,6vmin,34px);color:#fff;text-shadow:0 3px 0 #000,0 0 10px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none;will-change:transform}
#nums div.big{color:#ffd23a;font-size:clamp(30px,9vmin,52px)}
#nums div.you{color:#ff7a68}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#slow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(40,120,255,0) 45%,rgba(20,60,160,.55))}
body.slow #slow{opacity:1}
#finger{position:fixed;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(0,0,0,.4);opacity:0;transition:opacity .15s;pointer-events:none}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,14,34,.45),rgba(8,10,26,.85));opacity:0;pointer-events:none;transition:opacity .4s;padding:16vh 16px 14vh}
#end.show{opacity:1;pointer-events:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:min(2.6vh,18px);text-align:center;max-width:520px;transform:translateY(20px);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#end.show .card{transform:none}
.logo{font-family:Bungee,Impact,sans-serif;font-size:clamp(44px,15vmin,96px);line-height:.95;color:#ffd23a;text-shadow:0 5px 0 #8a4b00,0 0 30px rgba(255,210,58,.45),0 10px 24px rgba(0,0,0,.6)}
.tag{font-size:clamp(14px,3.4vmin,18px);opacity:.85;text-shadow:0 2px 0 #000;margin-top:-4px}
#end-title{font-family:Bungee,Impact,sans-serif;font-size:clamp(18px,5vmin,30px);text-shadow:0 3px 0 #000}
#end-sub{font-size:clamp(15px,3.6vmin,20px);opacity:.92;text-shadow:0 2px 0 #000;max-width:30ch}
#cta{pointer-events:auto;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,5.6vmin,32px);color:#1a1004;background:linear-gradient(#ffe066,#ffb21a);border:0;border-radius:999px;padding:.7em 1.4em;box-shadow:0 6px 0 #a35d00,0 12px 26px rgba(0,0,0,.5);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
#cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a35d00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#retry{pointer-events:auto;background:none;border:0;color:#fff;font:700 17px "Chakra Petch",Arial,sans-serif;opacity:.85;text-decoration:underline;padding:8px 14px;cursor:pointer}
@media (orientation:landscape){
 #hud{top:max(9vh,30px)}
 #hint{top:max(22vh,80px)}
 #banner{top:24%}
 #end{padding:9vh 16px}
 .card{gap:min(1.8vh,10px)}
 .logo{font-size:clamp(40px,13vmin,80px)}
}
</style>
